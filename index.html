<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Scare Maze Sign-Up</title>
<style>
:root{
  --bg:#0a0a0a; /* Deep black */
  --fg:#ff6600; /* Bright orange */
  --mut:#ff9933; /* Lighter orange for secondary text */
  --card:#1a1a1a; /* Slightly lighter black for cards */
  --line:#ff6600; /* Orange borders */
  --acc:#ff3300; /* Brighter orange for buttons */
  --web:#444444; /* Spider web color */
}

/* Spider web background pattern */
body {
  background:
    radial-gradient(circle at 10% 10%, transparent 20%, var(--web) 20.5%, transparent 21%),
    radial-gradient(circle at 90% 20%, transparent 15%, var(--web) 15.5%, transparent 16%),
    radial-gradient(circle at 20% 80%, transparent 18%, var(--web) 18.5%, transparent 19%),
    radial-gradient(circle at 80% 90%, transparent 12%, var(--web) 12.5%, transparent 13%),
    var(--bg);
  background-size: 100px 100px, 120px 120px, 150px 150px, 130px 130px;
  margin: 0;
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  position: relative;
}

h1 {
  font-size: 28px;
  margin: 0 0 4px;
  text-align: center;
  text-shadow: 0 0 5px var(--acc);
}

p {
  margin: 0 0 12px;
  text-align: center;
}

.mut {
  color: var(--mut);
  font-size: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  margin: 12px 0;
  box-shadow: 0 0 10px rgba(255, 102, 0, 0.2);
}

label.l {
  display: block;
  font-size: 14px;
  color: var(--mut);
  margin: 10px 0 4px;
}

input[type=text], input[type=tel] {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
}

.roles {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.roles label {
  display: block;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  background: var(--bg);
  cursor: pointer;
  transition: all 0.2s;
}

.roles label:hover {
  border-color: var(--acc);
  box-shadow: 0 0 5px rgba(255, 51, 0, 0.3);
}

.roles input {
  position: absolute;
  opacity: 0;
}

.roles label:has(input:checked) {
  border-color: var(--acc);
  background: rgba(255, 51, 0, 0.1);
}

.roles label:has(input:focus-visible) {
  outline: 2px solid var(--acc);
}

.roles b {
  display: block;
  font-size: 15px;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 10px;
  background: var(--acc);
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
}

button:hover {
  background: #ff4d00;
  box-shadow: 0 0 10px rgba(255, 51, 0, 0.5);
}

button.ghost {
  background: transparent;
  color: var(--acc);
  border: 2px solid var(--acc);
}

button.ghost:hover {
  background: rgba(255, 51, 0, 0.1);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#out {
  margin-top: 12px;
  font-size: 15px;
  text-align: center;
}

.hp {
  position: absolute;
  left: -9999px;
}

/* cobweb corners for the card */
.card::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--web);
  border-left: none;
  border-bottom: none;
}

.card::after {
  content: "";
  position: absolute;
  bottom: -10px;
  right: -10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--web);
  border-right: none;
  border-top: none;
}
</style></head>
<body><main>
<h1>🕷️ 2026 Scare Maze Sign-Up 🕸️</h1>
<p class="mut">Join us at 46 Butts Road, 5:00pm, 31 October. Two spots only - don't get caught in our web, sign up fast!</p>

<form id="f" class="card" action="https://formspree.io/f/xdeaqrwe" method="POST">
  <label class="l" for="name">Your name</label>
  <input type="text" id="name" name="name" maxlength="30" required autocomplete="off">

  <label class="l" for="phone">Parent or guardian phone number</label>
  <input type="tel" id="phone" name="phone" required inputmode="tel" pattern="[0-9+()\s\-]{10,16}" title="Enter a phone number: 10 to 16 digits, spaces, dashes or a + sign">

  <label class="l">How would you like to haunt with us?</label>
  <div class="roles">
    <label><input type="radio" name="role" value="Setup and Scare" required><b>Help set up AND scare</b><span class="mut">Be a double-threat - build then terrify!</span></label>
    <label><input type="radio" name="role" value="Scare only"><b>Just come to scare</b><span class="mut">Straight to the screaming, no heavy lifting.</span></label>
  </div>

  <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="_subject" value="Maze sign-up">

  <button type="submit" id="go">Sign me up</button>
  <button type="button" id="cancel" class="ghost" hidden>Give up my place</button>
  <div id="out" role="status"></div>
</form>

<p class="mut">⚠️ Remember: Anyone can say "stop" at any time and be walked out. No hard feelings - we don't want any real scares! ⚠️</p>
</main>
