<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Scare Maze Sign-Up</title>
<style>
:root{--bg:#fff;--fg:#1c1b19;--mut:#6b6a66;--card:#f4f2ee;--line:#d9d6cf;--acc:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--fg:#f1efe9;--mut:#a09e98;--card:#24222a;--line:#3a3842;--acc:#fb923c}}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px}p{margin:0 0 12px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
label.l{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=tel]{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.role{border:2px solid var(--acc);border-radius:12px;padding:12px;background:var(--bg)}
.role b{display:block;font-size:17px}
button{width:100%;margin-top:14px;padding:12px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
button:disabled{opacity:.5}
#out{margin-top:12px;font-size:15px}
.hp{position:absolute;left:-9999px}
</style></head>
<body><main>
<h1>2026 Scare Maze Sign-Up</h1>
<p class="mut">At The Rectory · 31 October. Two spots only, first come, first served.</p>

<form id="f" class="card" action="[formspree.io](https://formspree.io/f/xdeaqrwe)" method="POST">
  <label class="l" for="name">Your name</label>
  <input type="text" id="name" name="name" maxlength="30" required autocomplete="off">

  <label class="l" for="phone">Parent or guardian phone number</label>
  <input type="tel" id="phone" name="phone" required inputmode="tel" pattern="[0-9+()\s\-]{10,16}" title="Enter a phone number: 10 to 16 digits, spaces, dashes or a + sign">

  <label class="l">Your role</label>
  <div class="role"><b>Zombie</b><span class="mut">Bring your own costume.</span></div>

  <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="_subject" value="Maze sign-up">
  <input type="hidden" name="role" value="Zombie">

  <button type="submit" id="go">Sign me up</button>
  <button type="button" id="cancel" class="ghost" hidden>Give up my place</button>
  <div id="out" role="status"></div>
</form>

<p class="mut">Anyone can say "stop" at any time and be walked out.</p>
</main>

<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
<script>
const URL_="YOUR_PROJECT_URL";
const KEY_="YOUR_ANON_KEY";
const CAP=2;
const T="2026 Scare Maze Sign-Up";
const sb=supabase.createClient(URL_,KEY_);

let device=localStorage.getItem("maze-device");
if(!device){ device=crypto.randomUUID(); localStorage.setItem("maze-device",device); }

const f=document.getElementById("f"),out=document.getElementById("out"),
      go=document.getElementById("go"),cancelBtn=document.getElementById("cancel");

async function getState(){
  const {data,error}=await sb.from(T).select("name,device").eq("canceled",false);
  if(error) throw error;
  const mine=data.find(r=>r.device===device);
  return { mine, count:data.length };
}

function paint({mine,count}){
  if(mine){
    go.hidden=true; cancelBtn.hidden=false;
    localStorage.setItem("maze-name",mine.name);
    out.textContent="You are in. Would you like to give up your place?";
  } else if(localStorage.getItem("maze-canceled")==="1"){
    go.hidden=false; cancelBtn.hidden=true;
    out.textContent="Your spot is available — would you still like to participate?";
  } else if(count>=CAP){
    go.hidden=true; cancelBtn.hidden=true;
    out.textContent="No more actor spots are available at this time, try again later.";
  } else {
    go.hidden=false; cancelBtn.hidden=true; out.textContent="";
  }
}

async function refresh(){
  try{ paint(await getState()); }
  catch(e){ out.textContent="Couldn’t check the sign-ups. Try reloading."; }
}

f.addEventListener("submit",async e=>{
  e.preventDefault();
  go.disabled=true; out.textContent="Sending…";
  try{
    const {count}=await getState();
    if(count>=CAP){
      out.textContent="No more actor spots are available at this time, try again later.";
      go.disabled=false; return;
    }
    const name=f.name.value.trim();
    const {error}=await sb.from(T).insert({
      name, phone:f.phone.value.trim(), device, canceled:false
    });
    if(error) throw error;

    const fd=new FormData(f);
    await fetch(f.action,{method:"POST",headers:{Accept:"application/json"},body:fd});

    localStorage.removeItem("maze-canceled");
    localStorage.setItem("maze-name",name);
    f.reset(); await refresh();
  }catch(err){ out.textContent="That didn’t send. Check your connection and try again."; }
  go.disabled=false;
});

cancelBtn.addEventListener("click",async()=>{
  cancelBtn.disabled=true; out.textContent="Cancelling…";
  try{
    const {error}=await sb.from(T).update({canceled:true})
          .eq("device",device).eq("canceled",false);
    if(error) throw error;

    const who=localStorage.getItem("maze-name")||"A participant";
    const fd=new FormData();
    fd.append("_subject","Maze sign-up cancelled");
    fd.append("name",who);
    fd.append("message",who+" has canceled their spot in the maze");
    await fetch(f.action,{method:"POST",headers:{Accept:"application/json"},body:fd});

    localStorage.setItem("maze-canceled","1");
    await refresh();
  }catch(err){ out.textContent="That didn’t send. Check your connection and try again."; }
  cancelBtn.disabled=false;
});

refresh();
</script></body></html>
